# Reusable: fail a PR whose title isn't a Conventional Commit. Squash
# merges use the title as the commit on main, which release tooling reads.
#
# Caller (on: pull_request_target, types: [opened, edited, synchronize]):
#   jobs:
#     title:
#       uses: akhiakl/ci-workflows/.github/workflows/conventional-pr-title.yml@v1
name: Conventional PR title

on:
  workflow_call:
    inputs:
      types:
        description: Newline-separated allowed types.
        type: string
        required: false
        default: |
          feat
          fix
          chore
          refactor
          test
          docs

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
