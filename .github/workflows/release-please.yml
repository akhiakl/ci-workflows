# Reusable: keep a rolling release PR from Conventional Commits on main;
# merging it bumps the version, writes CHANGELOG.md, tags and publishes a
# GitHub Release. Pass a PAT as RELEASE_PLEASE_TOKEN so CI runs on the
# release PR (PRs opened with GITHUB_TOKEN don't trigger workflows).
#
# Caller (on: push to main; permissions contents + pull-requests: write):
#   jobs:
#     release:
#       uses: akhiakl/ci-workflows/.github/workflows/release-please.yml@v1
#       secrets: inherit
name: Release

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
