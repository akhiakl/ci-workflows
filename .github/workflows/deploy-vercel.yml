# Reusable: build and deploy the released tag to Vercel production with the
# Vercel CLI. Meant for `on: release: types: [published]`, so production only
# ships from tagged releases. Without the secret it logs and exits cleanly.
# Use this instead of a deploy hook when the project's Ignored Build Step
# skips production builds (Hobby has no way to disable git production deploys).
#
# Caller:
#   jobs:
#     production:
#       uses: akhiakl/ci-workflows/.github/workflows/deploy-vercel.yml@v1
#       with:
#         org-id: team_xxx
#         project-id: prj_xxx
#         smoke-url: https://example.com   # optional post-deploy check
#       secrets: inherit
name: Deploy

on:
  workflow_call:
    inputs:
      org-id:
        description: Vercel team or user ID (VERCEL_ORG_ID)
        required: true
        type: string
      project-id:
        description: Vercel project ID (VERCEL_PROJECT_ID)
        required: true
        type: string
      vercel-version:
        description: Vercel CLI version to run (pinned for reproducible deploys)
        required: false
        type: string
        default: "65.2.0"
      node-version:
        description: Node.js version used to run the CLI
        required: false
        type: string
        default: "24"
      smoke-url:
        description: Production URL that must answer 200 after the deploy (empty skips the check)
        required: false
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ inputs.org-id }}
      VERCEL_PROJECT_ID: ${{ inputs.project-id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Skip when VERCEL_TOKEN is unset
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not set, release tagged, no deploy."
      - uses: actions/checkout@v7
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: ${{ inputs.node-version }}
      # `vercel build` shells out to the project's package manager. Corepack
      # (bundled with Node) provides pnpm/yarn at the version pinned by the
      # repo's `packageManager` field; it is a no-op for npm projects.
      - name: Enable Corepack
        if: env.VERCEL_TOKEN != ''
        run: corepack enable
      - name: Build and deploy ${{ github.ref_name }}
        id: deploy
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_CLI: vercel@${{ inputs.vercel-version }}
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # The CLI returns once the deploy is ready; retries cover alias propagation.
      - name: Smoke check
        id: smoke
        if: env.VERCEL_TOKEN != '' && inputs.smoke-url != ''
        env:
          SMOKE_URL: ${{ inputs.smoke-url }}
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -L -w '%{http_code}' --max-time 20 "$SMOKE_URL" || true)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = 200 ] && exit 0
            sleep 6
          done
          exit 1
      - name: Summary
        if: always() && env.VERCEL_TOKEN != ''
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_URL: ${{ inputs.smoke-url }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ passed";; failure) echo "❌ failed";; skipped) echo "➖ skipped";; *) echo "⚠️ $1";; esac; }
          {
            echo "## Vercel production deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Deploy | $(icon "$DEPLOY_OUTCOME") |"
            [ -n "$DEPLOY_URL" ] && echo "| Deployment | $DEPLOY_URL |"
            [ -n "$SMOKE_URL" ] && echo "| Smoke check | $(icon "$SMOKE_OUTCOME") $SMOKE_URL |"
            true
          } >> "$GITHUB_STEP_SUMMARY"
